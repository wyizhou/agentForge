name: CI

on:
  push:
  pull_request:

jobs:
  posix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
      - name: Verify
        run: ./harness/verify.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify PowerShell
        shell: powershell
        run: .\harness\verify.ps1

  remote-posix:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Verify published POSIX launcher
        run: |
          launcher=$(mktemp)
          target=$(mktemp -d)/remote-project
          curl --retry 5 --retry-all-errors -fsSL \
            "https://raw.githubusercontent.com/${{ github.repository }}/${GITHUB_REF_NAME}/agentforge.sh" \
            -o "$launcher"
          sh "$launcher" --target "$target" --primary agents --harness yes --skill no --git no
          test -f "$target/AGENTS.md"
          test -f "$target/docs/harness/DELIVERY_RULES.md"
          test -f "$target/docs/harness/COMMANDS.md"
          test -f "$target/docs/harness/CHECKS.md"
          test ! -e "$target/harness"
          grep -F "docs/harness/DELIVERY_RULES.md" "$target/AGENTS.md"

  remote-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Verify published PowerShell launcher
        shell: powershell
        run: |
          $Launcher = Join-Path $env:RUNNER_TEMP "agentforge.ps1"
          $Target = Join-Path $env:RUNNER_TEMP "remote-project"
          $Url = "https://raw.githubusercontent.com/${{ github.repository }}/$env:GITHUB_REF_NAME/agentforge.ps1"
          for ($Attempt = 1; $Attempt -le 5; $Attempt++) {
            try { Invoke-WebRequest $Url -OutFile $Launcher; break }
            catch { if ($Attempt -eq 5) { throw }; Start-Sleep -Seconds 2 }
          }
          & $Launcher -Target $Target -Primary claude -Harness yes -Skill no -Git no
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath (Join-Path $Target "CLAUDE.md") -PathType Leaf)) { throw "Missing CLAUDE.md" }
          if (-not (Test-Path -LiteralPath (Join-Path $Target "docs/harness/DELIVERY_RULES.md") -PathType Leaf)) { throw "Missing delivery rules" }
          if (-not (Test-Path -LiteralPath (Join-Path $Target "docs/harness/COMMANDS.md") -PathType Leaf)) { throw "Missing command catalog" }
          if (-not (Test-Path -LiteralPath (Join-Path $Target "docs/harness/CHECKS.md") -PathType Leaf)) { throw "Missing enforcement map" }
          if (Test-Path -LiteralPath (Join-Path $Target "harness")) { throw "Generated project unexpectedly contains a Harness executable directory" }
          if ((Get-Content -LiteralPath (Join-Path $Target "CLAUDE.md") -Raw) -notmatch "docs/harness/DELIVERY_RULES\.md") { throw "CLAUDE.md does not reference delivery rules" }
